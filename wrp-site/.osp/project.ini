; Open Server Panel 6: настройки проекта World Role Play
;
; Папку проекта положите в C:\OSPanel\home\ под именем домена, например C:\OSPanel\home\wrp.local
; (внутри - app, config, public, sql, storage ...). Сайт откроется по адресу http://wrp.local/
; Если папка называется иначе, поменяйте имя секции [wrp.local] на нужный домен.
; После правки файла перезапустите OSPanel (или обновите проекты в меню).

[wrp.local]

; Корень сайта - папка public. Служебные папки app, config, sql, storage из браузера недоступны
public_dir = {base_dir}/public

; Версия PHP (подойдёт любая 7.4 - 8.x). Модуль должен быть включён в OSPanel
php_engine = PHP-8.1

; Веб-сервер. Apache читает наши .htaccess (кэш статики, запрет PHP в uploads).
; С Nginx сайт тоже работает, но .htaccess не учитываются
web_engine = Apache-2.4
